<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1233">
<title>異世界エルディア</title>
<style>
/* ===== css/style.css : 全体レイアウト・操作パッド ===== */
:root{--gold:#e8c35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#05081a;color:#f3ecd2;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
#app{position:fixed;inset:0;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto;grid-template-areas:"stage stage stage" "dpad . btns";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{image-rendering:pixelated;background:#000;display:block}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#ui{position:absolute;overflow:hidden;pointer-events:none}
#dpad{grid-area:dpad;display:grid;grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(3,var(--b));margin:6px 8px 10px;--b:clamp(38px,12vw,56px)}
#btns{grid-area:btns;display:flex;align-items:center;gap:8px;margin:6px 10px 10px;--b:clamp(46px,14vw,64px)}
.k{border:2px solid var(--gold);background:rgba(22,33,79,.88);color:var(--gold);font:700 18px/1 sans-serif;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0}
#dpad .k{border-radius:12px}
#btns .k{border-radius:50%;width:var(--b);height:var(--b)}
#btns .k.sm{width:calc(var(--b)*.75);height:calc(var(--b)*.75);font-size:11px}
.k.on{background:var(--gold);color:#0b1233}
@media (orientation:landscape){
 #app{grid-template-columns:auto 1fr auto;grid-template-rows:1fr;grid-template-areas:"dpad stage btns"}
 #dpad{align-self:end;--b:clamp(40px,14vh,58px)}
 #btns{flex-direction:column-reverse;align-self:end;--b:clamp(46px,15vh,64px)}
}
@media (hover:hover) and (pointer:fine){#dpad,#btns{display:none}#app{grid-template-areas:"stage stage stage";grid-template-rows:1fr}}
/* ===== css/game.css : ウィンドウ・メニュー ===== */
.win{position:absolute;background:linear-gradient(180deg,#1a2660,#0b1233);border:2px solid var(--gold);border-radius:8px;box-shadow:0 0 0 2px #05081a,inset 0 0 0 1px #3a4a8a;padding:.45em .7em;line-height:1.45;pointer-events:auto;max-width:96%}
.msg{left:2%;right:2%;bottom:2%;min-height:4.4em;white-space:pre-wrap}
.msg .tick{position:absolute;right:.6em;bottom:.2em;color:var(--gold);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.p-c{left:50%;top:50%;transform:translate(-50%,-50%)}
.p-r{right:2%;top:3%}
.p-bot{left:2%;right:2%;bottom:2%}
.p-tb{left:50%;bottom:8%;transform:translateX(-50%)}
.list{max-height:72%;min-width:10em;display:flex;flex-direction:column}
.ttl{color:var(--gold);font-weight:700;border-bottom:1px solid #e8c35a66;margin-bottom:.25em}
.items{position:relative;overflow-y:auto;display:grid;grid-template-columns:repeat(var(--cols,1),1fr);gap:.1em .6em}
.it{position:relative;padding:.3em .5em .3em 1.4em;display:flex;justify-content:space-between;gap:.8em;border-radius:4px}
.it small{opacity:.75;font-size:.8em;align-self:center}
.it.sel{background:#e8c35a22}
.it.sel::before{content:"▶";position:absolute;left:.3em;color:var(--gold)}
.it.dis{opacity:.4}
.panel{min-width:13em;line-height:1.7}
.bar{display:inline-block;vertical-align:middle;width:6em;height:.55em;background:#000;border:1px solid #556;border-radius:3px;overflow:hidden;margin:0 .4em}
.bar i{display:block;height:100%}
.hp{background:linear-gradient(#7fe07a,#2f9a3a)}.mp{background:linear-gradient(#7ab6ff,#2a5fd0)}
#hud{left:2%;top:2%;pointer-events:none;padding:.3em .6em}
#hud em{color:#c9a0ff;font-style:normal;margin-left:.4em}
#title{position:absolute;left:0;right:0;top:10%;text-align:center;pointer-events:none}
#title h1{margin:0;font-size:2.6em;line-height:1.15;letter-spacing:.12em;color:var(--gold);text-shadow:0 2px 0 #7a5a10,0 0 14px #e8c35a88}
#title p{margin:.6em 0 0;letter-spacing:.3em;color:#cfd6ff}
.toast{position:absolute;top:3%;left:50%;transform:translateX(-50%);background:#0b1233e6;border:1px solid var(--gold);border-radius:6px;padding:.2em .9em;pointer-events:none;white-space:nowrap}
#stage.hit{animation:sh .3s}
@keyframes sh{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,0)}}
#err{position:fixed;left:0;right:0;top:0;background:#600;color:#fff;font:12px monospace;padding:8px;z-index:99;white-space:pre-wrap;display:none;-webkit-user-select:text;user-select:text}
</style>
</head>

<div id="app">
 <div id="stage"><canvas id="cv"></canvas><div id="fade"></div><div id="ui"><div id="title" style="display:none"><h1>異世界<br>エルディア</h1><p>転生冒険記</p></div></div></div>
 <div id="dpad">
  <button class="k" data-k="up" style="grid-area:1/2">▲</button>
  <button class="k" data-k="left" style="grid-area:2/1">◀</button>
  <button class="k" data-k="right" style="grid-area:2/3">▶</button>
  <button class="k" data-k="down" style="grid-area:3/2">▼</button>
 </div>
 <div id="btns">
  <button class="k sm" data-k="menu">MENU</button>
  <button class="k" data-k="cancel">B</button>
  <button class="k" data-k="ok">A</button>
 </div>
</div>
<div id="err"></div>

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ===================== js/gfx.js : 描画（ドット絵はコードで生成） =====================
const Gfx = (() => {
  const cv = $('#cv'), g = cv.getContext('2d');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const R = (q, x, y, w, h, c) => { q.fillStyle = c; q.fillRect(x, y, w, h); };
  const hash = n => [...n].reduce((s, c) => (s * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rng = s => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const noise = (q, r, cols, n) => { for (let i = 0; i < n; i++) R(q, (r() * 16) | 0, (r() * 16) | 0, 1, 1, cols[(r() * cols.length) | 0]); };
  const brick = (q, c1, c2, w) => { for (let y = 0; y < 16; y += 4) { R(q, 0, y + 3, 16, 1, c2); for (let x = (y / 4 % 2) * 4; x < 16; x += 8) R(q, x, y, 1, 3, c2); } };
  // タイル描画関数。追加したいタイルはここに関数を足し、Data.tilesに登録するだけ
  const P = {
    grass(q, r) { R(q, 0, 0, 16, 16, '#3f9b3a'); noise(q, r, ['#368f33', '#4cae45', '#2f8530'], 26); for (let i = 0; i < 3; i++) { const x = (r() * 13 | 0) + 1, y = (r() * 12 | 0) + 2; R(q, x, y, 1, 2, '#62c455'); R(q, x + 1, y + 1, 1, 1, '#62c455'); } },
    forest(q, r) { P.grass(q, r); R(q, 7, 11, 3, 4, '#6b4423'); R(q, 4, 1, 8, 2, '#1f6b2b'); R(q, 2, 2, 12, 9, '#1f6b2b'); R(q, 3, 3, 10, 6, '#2f8a3a'); R(q, 5, 3, 3, 2, '#4fae50'); R(q, 9, 6, 2, 2, '#4fae50'); R(q, 2, 10, 12, 1, '#175020'); },
    mountain(q, r) { R(q, 0, 0, 16, 16, '#6f6358'); R(q, 5, 3, 6, 2, '#9a8f84'); R(q, 7, 1, 2, 2, '#e8eef5'); R(q, 6, 3, 4, 1, '#e8eef5'); R(q, 3, 5, 10, 3, '#857a6e'); R(q, 6, 5, 2, 3, '#a89d92'); R(q, 1, 8, 14, 4, '#6a5e52'); R(q, 0, 12, 16, 4, '#554b42'); noise(q, r, ['#4a4038', '#8a7e72'], 14); },
    water(q, r, f) { R(q, 0, 0, 16, 16, '#2a64c8'); const o = f ? 4 : 0; for (let i = 0; i < 4; i++) { R(q, (2 + o + i * 3) % 12, i * 4 + 1, 4, 1, '#5a92ea'); R(q, (9 + o + i * 5) % 12, i * 4 + 3, 3, 1, '#1f4fa8'); } },

  // 人物スプライト（4方向×3コマ）。右向きは左向きを反転

// ===================== js/input.js : キーボード＋タッチ共存 =====================
const Input = (() => {
  const held = new Set(), order = [], rep = {};
  const KEYS = { arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right', w: 'up', s: 'down', a: 'left', d: 'right', z: 'ok', enter: 'ok', ' ': 'ok', x: 'cancel', escape: 'cancel', backspace: 'cancel', m: 'menu' };
  function press(a) {
    if (held.has(a)) return; held.add(a);
    if (DIRS[a]) order.push(a);
    Game.onAction(a);
    if (DIRS[a]) rep[a] = { d: setTimeout(() => { rep[a].i = setInterval(() => Game.onAction(a), 90); }, 300) };
  }
  function release(a) {
    held.delete(a); const i = order.indexOf(a); if (i >= 0) order.splice(i, 1);
    if (rep[a]) { clearTimeout(rep[a].d); clearInterval(rep[a].i); delete rep[a]; }
  }
  const releaseAll = () => [...held].forEach(release);
  const dir = () => order.length ? order[order.length - 1] : null;
  function init() {
    addEventListener('keydown', e => { const a = KEYS[e.key.toLowerCase()]; if (!a) return; e.preventDefault(); if (!e.repeat) press(a); });
    addEventListener('keyup', e => { const a = KEYS[e.key.toLowerCase()]; if (a) release(a); });
    addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', releaseAll);
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.querySelectorAll('[data-k]').forEach(b => {
      const k = b.dataset.k;
      b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) { } b.classList.add('on'); press(k); });
      const up = () => { b.classList.remove('on'); release(k); };
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
    });
  }
  return { init, dir };
})();

// ===================== js/ui.js : ウィンドウ群（Promiseで待てる） =====================
const UI = (() => {
  const root = $('#ui'), fadeEl = $('#fade'), stack = [];
  const el = (c, h) => { const d = document.createElement('div'); d.className = c; if (h != null) d.innerHTML = h; return d; };
  const push = w => { stack.push(w); root.appendChild(w.el); };
  const pop = w => { const i = stack.indexOf(w); if (i >= 0) stack.splice(i, 1); w.el.remove(); };
  const active = () => stack.length > 0;
  const onAction = a => { const w = stack[stack.length - 1]; if (w) w.act(a); };
  // メッセージ（1文字ずつ表示。auto>0なら自動で閉じる。OKで早送り）
  function say(text, o = {}) {
    return new Promise(res => {
      const e = el('win msg'), t = el(''), tick = el('tick', '▼'); e.append(t, tick); tick.style.visibility = 'hidden';
      let i = 0, done = false; const auto = o.auto || 0;
      const close = () => { pop(w); res(); };
      const finish = () => { clearInterval(timer); t.textContent = text; done = true; tick.style.visibility = 'visible'; if (auto) setTimeout(close, auto); };
      const w = { el: e, act: a => { if (a === 'ok' || a === 'cancel') { if (!done) finish(); else close(); } } };
      e.onclick = () => w.act('ok');
      const timer = setInterval(() => { t.textContent = text.slice(0, ++i); if (i >= text.length) finish(); }, 22);
      push(w);
    });
  }
  const talk = async lines => { for (const l of lines) await say(l); };
  // 選択リスト。戻り値は選んだ番号、キャンセルは-1
  function choose(items, o = {}) {
    return new Promise(res => {
      const cols = o.cols || 1; let sel = Math.max(0, items.findIndex(i => !i.dis));
      const e = el('win list p-' + (o.pos || 'c'));
      if (o.title) e.appendChild(el('ttl', esc(o.title)));
      const box = el('items'); box.style.setProperty('--cols', cols); e.appendChild(box);
      const els = items.map((it, i) => {
        const d = el('it' + (it.dis ? ' dis' : ''), `<span>${esc(it.label)}</span>` + (it.sub != null ? `<small>${esc(it.sub)}</small>` : ''));
        d.onclick = () => { sel = i; draw(); w.act('ok'); }; box.appendChild(d); return d;
      });
      const draw = () => els.forEach((d, i) => {
        d.classList.toggle('sel', i === sel);
        if (i === sel) { if (d.offsetTop < box.scrollTop) box.scrollTop = d.offsetTop; else if (d.offsetTop + d.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = d.offsetTop + d.offsetHeight - box.clientHeight; }
      });
      const close = v => { pop(w); res(v); };
      const w = {
        el: e, act: a => {
          const n = items.length; if (!n) { if (a === 'ok' || a === 'cancel') close(-1); return; }
          if (a === 'up') sel = ((sel - cols) % n + n) % n; else if (a === 'down') sel = (sel + cols) % n;
          else if (a === 'left' && cols > 1) sel = (sel - 1 + n) % n; else if (a === 'right' && cols > 1) sel = (sel + 1) % n;
          else if (a === 'ok') { if (!items[sel].dis) close(sel); return; }
          else if (a === 'cancel' || a === 'menu') { if (!o.noCancel) close(-1); return; }
          draw();
        }
      };
      push(w); draw();
    });
  }
  const confirm = async q => { await 0; return (await choose([{ label: 'はい' }, { label: 'いいえ' }], { pos: 'tb', title: q })) === 0; };
  function panel(html) {
    return new Promise(res => {
      const w = { el: el('win panel p-c', html), act: a => { if (a === 'ok' || a === 'cancel' || a === 'menu') { pop(w); res(); } } };
      w.el.onclick = () => w.act('ok'); push(w);
    });
  }
  let hudEl = null;
  function hud(html) { if (hudEl) { hudEl.remove(); hudEl = null; } if (html) { hudEl = el('win', html); hudEl.id = 'hud'; root.appendChild(hudEl); } }
  function toast(t) { const d = el('toast', esc(t)); root.appendChild(d); setTimeout(() => d.remove(), 1800); }
  function fade(a, ms = 300) { return new Promise(r => { fadeEl.style.transition = `opacity ${ms}ms`; fadeEl.style.opacity = a; setTimeout(r, ms + 20); }); }
  const bar = (v, m, c) => `<span class="bar"><i class="${c}" style="width:${clamp(v / m * 100, 0, 100)}%;display:block"></i></span>`;
  return { say, talk, choose, confirm, panel, hud, toast, fade, active, onAction, bar };
})();

// ===================== js/map.js : タイルマップ・当たり判定 =====================
const GMap = (() => {
  let cur = null;
  function load(id) {
    const d = Data.maps[id];
    cur = { id, d, w: d.rows[0].length, h: d.rows.length, t: d.rows.map(r => [...r].map(ch => Data.tiles[ch] || Data.tiles['.'])), objs: (d.objects || []).map(o => ({ ...o })) };
    return cur;
  }
  const visible = (o, fl) => !(o.t === 'boss' && fl[o.flag]);
  const objAt = (x, y, fl) => cur.objs.find(o => o.x === x && o.y === y && visible(o, fl));
  const pass = (x, y, fl) => x >= 0 && y >= 0 && x < cur.w && y < cur.h && cur.t[y][x].pass && !objAt(x, y, fl);
  function draw(q, cx, cy, W, H, t) {
    const f = (t / 500 | 0) & 1;
    const sx = Math.max(0, Math.floor(cx / 16)), sy = Math.max(0, Math.floor(cy / 16)), ex = Math.min(cur.w - 1, Math.floor((cx + W - 1) / 16)), ey = Math.min(cur.h - 1, Math.floor((cy + H - 1) / 16));
    for (let y = sy; y <= ey; y++) for (let x = sx; x <= ex; x++) q.drawImage(Gfx.tile(cur.t[y][x].n, f), x * 16 - cx, y * 16 - cy);
  }
  return { load, get cur() { return cur; }, objAt, pass, draw, visible };
})();

// ===================== js/player.js : ステータス・アイテム・クエスト =====================
const Player = (() => {
  const BASE = { maxHp: 30, maxMp: 8, atk: 7, def: 3, spd: 5, mag: 4 };
  const need = lv => 10 * lv + 4 * lv * lv;
  function recalc(p) {
    const w = Data.items[p.equip.weapon], a = Data.items[p.equip.armor];
    p.maxHp = p.base.maxHp; p.maxMp = p.base.maxMp; p.spd = p.base.spd; p.mag = p.base.mag;
    p.atk = p.base.atk + (w && w.atk || 0); p.def = p.base.def + (a && a.def || 0);
    p.hp = Math.min(p.hp, p.maxHp); p.mp = Math.min(p.mp, p.maxMp);
  }
  function create(name) {
    const p = { name, lv: 1, exp: 0, gold: 30, base: { ...BASE }, hp: 30, mp: 8, inv: { potion: 3 }, equip: { weapon: 'wood_sword', armor: 'cloth' }, quests: {}, st: {} };
    recalc(p); p.hp = p.maxHp; p.mp = p.maxMp; return p;
  }
  function gainExp(p, n) {
    const m = []; p.exp += n;
    while (p.exp >= need(p.lv)) {
      p.exp -= need(p.lv); p.lv++;
      for (const k in Data.growth) p.base[k] += Data.growth[k];
      p.hp += Data.growth.maxHp; p.mp += Data.growth.maxMp; recalc(p);
      m.push(`${p.name}は レベル${p.lv}に あがった！`);
      for (const s of Object.values(Data.skills)) if (s.learn === p.lv) m.push(`${s.name}を おぼえた！`);
    }
    return m;
  }
  const skills = p => Object.entries(Data.skills).filter(([, s]) => s.learn && s.learn <= p.lv).map(([id, s]) => ({ id, ...s }));
  return { create, recalc, gainExp, skills, need };
})();

const Items = {
  add(p, id, n = 1) { p.inv[id] = (p.inv[id] || 0) + n; },
  take(p, id) { if ((p.inv[id] || 0) > 0) p.inv[id]--; if (!p.inv[id]) delete p.inv[id]; },
  list: (p, type) => Object.keys(p.inv).filter(id => p.inv[id] > 0 && Data.items[id] && (!type || Data.items[id].type === type)),
  canUse(p, id) { const it = Data.items[id]; return !!it && it.type === 'use' && ((it.hp && p.hp < p.maxHp) || (it.mp && p.mp < p.maxMp) || (it.cure && p.st && p.st[it.cure])); },
  use(p, id) {
    if (!Items.canUse(p, id)) return { ok: false, msg: 'つかっても こうかが なさそうだ。' };
    const it = Data.items[id], m = [];
    if (it.hp && p.hp < p.maxHp) { const h = Math.min(it.hp, p.maxHp - p.hp); p.hp += h; m.push(`HPが ${h}かいふくした！`); }
    if (it.mp && p.mp < p.maxMp) { const h = Math.min(it.mp, p.maxMp - p.mp); p.mp += h; m.push(`MPが ${h}かいふくした！`); }
    if (it.cure && p.st[it.cure]) { delete p.st[it.cure]; m.push('どくが きえた！'); }
    Items.take(p, id); return { ok: true, msg: `${p.name}は ${it.name}を つかった！\n` + m.join('\n') };
  },
  equip(p, slot, id) { const old = p.equip[slot]; if (old) Items.add(p, old); Items.take(p, id); p.equip[slot] = id; Player.recalc(p); }
};

const Quest = {
  async talk(npc, p) {
    for (const id of npc.quests) {
      const q = Data.quests[id], s = p.quests[id];
      if (s && s.st === 'done') continue;
      if (!s) { await UI.talk(q.lines.offer); p.quests[id] = { st: 'active', n: 0 }; await UI.say(`クエスト「${q.name}」を うけた！`); return; }
      if (s.n >= q.goal.n) {
        await UI.talk(q.lines.done); s.st = 'done'; const r = q.reward;
        p.gold += r.gold; if (r.item) Items.add(p, r.item, r.n || 1);
        await UI.say(`${r.gold}ゴールドと ${Data.items[r.item].name}${r.n > 1 ? ' x' + r.n : ''}を もらった！\nクエストを クリアした！`);
        for (const m of Player.gainExp(p, r.exp)) await UI.say(m);
        return;
      }
      await UI.talk(q.lines.active); return;
    }
    await UI.talk(npc.lines);
  },
  onKill(p, mid) { for (const id in p.quests) { const s = p.quests[id], q = Data.quests[id]; if (q && s.st === 'active' && q.goal.kill === mid && s.n < q.goal.n) s.n++; } }
};

// ===================== js/battle.js : ターン制コマンドバトル =====================
const Combat = {
  elem: (d, e) => (e && d.res && d.res[e] != null) ? d.res[e] : 1,
  calc(a, d, sk) {
    const mg = sk && sk.type === 'magic', mult = Combat.elem(d, sk && sk.elem);
    let b = mg ? sk.power + a.mag * 1.2 : a.atk * (sk ? sk.power : 1) - d.def * .5;
    const crit = !mg && Math.random() < .07; if (crit) b *= 1.6;
    b *= mult * rnd(.88, 1.12); if (d.guard) b *= .5;
    return { v: Math.max(1, Math.round(b)), crit, mult };
  }
};

const Battle = (() => {
  let B = null;
  const say = (t, a) => UI.say(t, { auto: a || 0 });
  const alive = () => B.en.filter(e => e.hp > 0);
  const P = () => Game.state.player;
  function mk(id, i) {
    const d = Data.monsters[id];
    return { i, id, base: d.name, name: d.name, hp: d.hp, maxHp: d.hp, mp: 99, atk: d.atk, def: d.def, spd: d.spd, mag: d.mag || 0, res: d.res || {}, st: {}, ai: d.ai, exp: d.exp, gold: d.gold };
  }
  function hud() {
    const p = P();
    UI.hud(`<b>${esc(p.name)}</b> Lv${p.lv}${p.st.poison ? '<em>どく</em>' : ''}${p.st.sleep ? '<em>ねむり</em>' : ''}<br>HP${UI.bar(p.hp, p.maxHp, 'hp')}${p.hp}/${p.maxHp}<br>MP${UI.bar(p.mp, p.maxMp, 'mp')}${p.mp}/${p.maxMp}`);
  }
  function hit(t) {
    if (t === P()) { const s = $('#stage'); s.classList.remove('hit'); void s.offsetWidth; s.classList.add('hit'); }
    else { B.fx[t.i] = Date.now() + 350; if (t.hp <= 0 && !t.deadAt) t.deadAt = Date.now(); }
  }
  async function pickTarget() {
    const l = alive(); if (l.length === 1) return l[0];

  async function cmdPhase() {

        const j = await UI.choose(list.map(s => ({ label: s.name, sub: 'MP' + s.mp, dis: p.mp < s.mp })), { pos: 'bot', title: i === 2 ? 'まほう' : 'スキル' });

        const ids = Items.list(p, 'use');
        const j = await UI.choose(ids.map(id => ({ label: Data.items[id].name, sub: 'x' + p.inv[id], dis: !Items.canUse(p, id) })), { pos: 'bot', title: 'どうぐ' });

  // 技・通常攻撃の実行（プレイヤー/敵 共通）
  async function perform(u, t, sk) {
    const L = [];

    if (sk && sk.heal) {

    } else {
      const r = Combat.calc(u, t, sk); t.hp = Math.max(0, t.hp - r.v); hit(t); hud();
      if (r.crit) L.push('かいしんの いちげき！');
      if (r.mult > 1) L.push('こうかは ばつぐんだ！'); else if (r.mult < 1) L.push('こうかは いまひとつのようだ…');
      L.push(`${t.name}に ${r.v}の ダメージ！`);
      if (sk && sk.status && t.hp > 0) for (const k in sk.status) if (!t.st[k] && Math.random() < sk.status[k]) { t.st[k] = k === 'poison' ? 4 : 3; L.push(k === 'poison' ? `${t.name}は どくに おかされた！` : `${t.name}は ねむってしまった！`); hud(); }
      if (t.hp <= 0 && t !== P()) L.push(`${t.name}を たおした！`);
    }
    await say(L.join('\n'), 750);
  }
  async function turn(a, ac) {
    const p = P();
    if (a.st.sleep) { a.st.sleep--; if (a.st.sleep > 0) { await say(`${a.name}は ねむっている…`, 600); return post(a); } await say(`${a.name}は めを さました！`, 600); hud(); }
    if (a === p) {
      if (ac.t === 'guard') { p.guard = true; await say(`${p.name}は みを まもっている。`, 600); }
      else if (ac.t === 'atk') { const t = ac.target.hp > 0 ? ac.target : alive()[0]; if (t) await perform(p, t, null); }
      else if (ac.t === 'skill') { p.mp -= ac.sk.mp; hud(); await perform(p, ac.target && ac.target.hp > 0 ? ac.target : (ac.sk.target === 'self' ? p : alive()[0]), ac.sk); }
      else if (ac.t === 'item') { const r = Items.use(p, ac.id); hud(); await say(r.msg, 700); }
    } else {
      const ok = a.ai.filter(x => !x.hp || a.hp / a.maxHp < x.hp), c = wpick(ok.length ? ok : a.ai);
      if (c.a === 'attack') await perform(a, p, null);
      else { const sk = Data.skills[c.a]; await perform(a, sk.target === 'self' || sk.heal ? a : p, sk); }
    }
    return post(a);
  }
  async function post(a) {
    if (a.st.poison && a.hp > 0) {
      const d = Math.max(1, Math.floor(a.maxHp / 10)); a.hp = Math.max(0, a.hp - d); a.st.poison--; hit(a); hud();
      await say(`${a.name}は どくで ${d}の ダメージ！`, 600);
    }
  }
  const endCheck = () => P().hp <= 0 ? 'lose' : (!alive().length ? 'win' : null);
  async function start(o) {
    const p = P(); p.st = {}; p.guard = false;
    B = { en: o.m.map(mk), bg: o.bg || GMap.cur().d.bg, boss: !!o.boss, fx: {} };
    const cnt = {}, seen = {}; B.en.forEach(e => cnt[e.base] = (cnt[e.base] || 0) + 1);
    B.en.forEach(e => { if (cnt[e.base] > 1) { seen[e.base] = (seen[e.base] || 0) + 1; e.name = e.base + 'ABC'[seen[e.base] - 1]; } });
    await UI.fade(1, 220); Game.scene = 'battle'; hud(); await UI.fade(0, 220);
    await say(B.en.map(e => e.name).join('、') + (o.boss ? ' が たちはだかった！' : ' が あらわれた！'), 900);
    let res = null;
    while (!res) {
      p.guard = false;
      let ac = { t: 'none' }; if (!p.st.sleep) ac = await cmdPhase();
      if (ac.t === 'run') {
        await say(`${p.name}は にげだした！`, 500);
        const avg = alive().reduce((s, e) => s + e.spd, 0) / alive().length;
        if (Math.random() < clamp(.5 + (p.spd - avg) * .06, .25, .9)) { res = 'run'; break; }
        await say('しかし まわりこまれてしまった！', 700); ac = { t: 'none' };
      }
      const order = [p, ...alive()].map(a => ({ a, k: a.spd * rnd(.8, 1.2) + (a === p && ac.t === 'guard' ? 1000 : 0) })).sort((x, y) => y.k - x.k).map(x => x.a);
      for (const a of order) { if (a.hp <= 0) continue; await turn(a, ac); res = endCheck(); if (res) break; }
    }
    if (res === 'win') {
      let exp = 0, gold = 0; const drops = [];
      B.en.forEach(e => { exp += e.exp; gold += e.gold; Quest.onKill(p, e.id); const dr = Data.monsters[e.id].drop; if (dr && Math.random() < dr.r) drops.push(dr.id); });
      p.gold += gold;
      await say(`${p.name}は たたかいに しょうりした！\n${exp}の けいけんち、${gold}ゴールドを かくとく！`);
      for (const d of drops) { Items.add(p, d); await say(`${Data.items[d].name}を てにいれた！`); }
      for (const m of Player.gainExp(p, exp)) await say(m);
    } else if (res === 'lose') await say(`${p.name}は ちからつきた……`);
    p.st = {}; p.guard = false; UI.hud(null); B = null;
    if (res !== 'lose') { await UI.fade(1, 220); Game.scene = 'field'; await UI.fade(0, 220); } else Game.scene = 'field';
    return res;
  }
  function render(q, W, H) {
    if (!B) return;
    const t = Date.now(), hz = Math.round(H * .6), [a, b, gr] = B.bg;
    const gd = q.createLinearGradient(0, 0, 0, hz); gd.addColorStop(0, a); gd.addColorStop(1, b);
    q.fillStyle = gd; q.fillRect(0, 0, W, hz); q.fillStyle = gr; q.fillRect(0, hz, W, H - hz);
    q.fillStyle = 'rgba(0,0,0,.18)'; for (let y = hz + 6; y < H; y += 10) q.fillRect(0, y, W, 2);
    const n = B.en.length;
    B.en.forEach((e, i) => {
      const d = Data.monsters[e.id], s = Math.max(2, Math.min(d.scale || (n > 2 ? 4 : 6), Math.floor((hz - 14) / 16), Math.floor(W / (n + .5) / 16))), w = 16 * s;
      const cx = W * (i + 1) / (n + 1); let x = cx - w / 2, al = 1;
      if (e.deadAt) { al = 1 - (t - e.deadAt) / 500; if (al <= 0) return; }
      if (B.fx[i] > t) { x += Math.round(Math.sin(t / 25) * 3); al = Math.min(al, (t / 60 | 0) % 2 ? .4 : 1); }
      const y = hz + 8 - w + (e.deadAt ? 0 : Math.round(Math.sin(t / 350 + i) * 2));
      q.globalAlpha = .3; q.fillStyle = '#000'; q.beginPath(); q.ellipse(cx, hz + 6, w * .4, w * .08, 0, 0, 7); q.fill();
      q.globalAlpha = al; q.drawImage(Gfx.mon(e.id), Math.round(x), y, w, w); q.globalAlpha = 1;
    });
  }
  return { start, render };
})();

// ===================== js/save.js : localStorage（スロット式・バージョン管理） =====================
const Settings = { enc: 2, font: 1 };
const Save = (() => {
  const VER = 1, PFX = 'eldia.save.', N = 3;
  // 将来バージョンが上がったら、ここで古いデータを新形式へ変換する
  const migrate = d => { if (!d || typeof d !== 'object' || !d.state || d.ver > VER) return null; return d; };
  function read(s) { try { const v = localStorage.getItem(PFX + s); return v ? migrate(JSON.parse(v)) : null; } catch (e) { return null; } }
  function write(s, state) { try { localStorage.setItem(PFX + s, JSON.stringify({ ver: VER, savedAt: Date.now(), state })); return true; } catch (e) { return false; } }
  const any = () => [...Array(N).keys()].some(read);
  function loadSettings() { try { Object.assign(Settings, JSON.parse(localStorage.getItem('eldia.settings') || '{}')); } catch (e) { } }
  function saveSettings() { try { localStorage.setItem('eldia.settings', JSON.stringify(Settings)); } catch (e) { } }
  function slotItems() {
    return [...Array(N).keys()].map(s => {
      const d = read(s), p = d && d.state.player;
      return { label: 'スロット' + (s + 1), sub: d ? `${p.name} Lv${p.lv} ${Data.maps[d.state.map] ? Data.maps[d.state.map].name : ''} ${new Date(d.savedAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}` : '---' };
    });
  }
  return { N, read, write, any, loadSettings, saveSettings, slotItems };
})();

// ===================== js/game.js : フィールド・イベント・全体制御 =====================
const Field = (() => {
  const MOVE = .17; let mv = null;
  const S = () => Game.state;
  function load(id, x, y, dir) { const s = S(); s.map = id; GMap.load(id); s.x = x; s.y = y; if (dir) s.dir = dir; mv = null; }
  async function warp(w) { await UI.fade(1, 220); load(w.to, w.tx, w.ty, w.dir); await UI.fade(0, 220); UI.toast(GMap.cur().d.name); }
  async function fight(grp, boss) { const r = await Battle.start({ m: grp, boss }); if (r === 'lose') await Game.gameOver(); return r; }
  function stepEvent() {
    const s = S(), m = GMap.cur(); s.steps++;
    const w = (m.d.warps || []).find(w => w.x === s.x && w.y === s.y); if (w) return () => warp(w);
    if (m.d.enc) {
      const td = m.t[s.y][s.x];
      if (td.enc) { s.since++; if (s.since >= 4 && Math.random() < m.d.enc.rate * td.enc * [0, .5, 1][Settings.enc]) { s.since = 0; const g = wpick(m.d.enc.list).m; return () => fight(g, false); } }
    }
    return null;
  }
  function update(dt) {
    const s = S(); if (!s) return; s.play += dt;
    if (Game.busy || UI.active()) return;
    let left = dt;
    if (mv) {
      mv.t += left / MOVE; if (mv.t < 1) return;
      left = (mv.t - 1) * MOVE; s.x = mv.tx; s.y = mv.ty; mv = null;
      const ev = stepEvent(); if (ev) { Game.run(ev); return; }
    }
    const d = Input.dir(); if (!d) return; s.dir = d;
    const [dx, dy] = DIRS[d]; if (GMap.pass(s.x + dx, s.y + dy, s.flags)) mv = { tx: s.x + dx, ty: s.y + dy, t: left / MOVE };
  }
  function interact() {
    if (mv) return; const s = S(), [dx, dy] = DIRS[s.dir], o = GMap.objAt(s.x + dx, s.y + dy, s.flags);
    if (o) Game.run(() => Events.touch(o));
  }
  function render(q, W, H) {
    const s = S(), m = GMap.cur(), t = Date.now();
    q.fillStyle = '#000'; q.fillRect(0, 0, W, H);
    const px = s.x * 16 + (mv ? (mv.tx - s.x) * 16 * Math.min(1, mv.t) : 0), py = s.y * 16 + (mv ? (mv.ty - s.y) * 16 * Math.min(1, mv.t) : 0);
    const cx = m.w * 16 <= W ? Math.round((m.w * 16 - W) / 2) : clamp(Math.round(px + 8 - W / 2), 0, m.w * 16 - W);
    const cy = m.h * 16 <= H ? Math.round((m.h * 16 - H) / 2) : clamp(Math.round(py + 8 - H / 2), 0, m.h * 16 - H);
    GMap.draw(q, cx, cy, W, H, t);
    const dr = [];
    m.objs.forEach(o => {
      if (!GMap.visible(o, s.flags)) return;
      let img;
      if (o.t === 'npc') img = Gfx.char(o.pal, o.dir || 'down', 0);
      else if (o.t === 'chest') img = Gfx.chest(!!s.flags[o.id]);
      else if (o.t === 'gather') { const f = s.flags[o.id]; img = Gfx.gather(!f || s.steps + 1 - f >= o.respawn); }
      else if (o.t === 'boss') img = Gfx.mon(o.m[0]);
      dr.push({ y: o.y * 16, img, x: o.x * 16, o });
    });
    dr.push({ y: py, img: Gfx.char('hero', s.dir, mv ? (mv.t < .5 ? 1 : 2) : 0), x: px });
    dr.sort((a, b) => a.y - b.y).forEach(d => {
      q.drawImage(d.img, Math.round(d.x) - cx, Math.round(d.y) - cy);
      if (d.o && d.o.t === 'gather' && Gfx.gather(true) === d.img && (t / 300 | 0) % 2) { q.fillStyle = '#fff'; q.fillRect(d.x - cx + 11, d.y - cy + 4, 1, 1); q.fillRect(d.x - cx + 3, d.y - cy + 6, 1, 1); }
    });
  }
  return { load, update, interact, render };
})();

const Events = {
  async touch(o) {
    const s = Game.state, p = s.player;
    if (o.t === 'npc') {
      o.dir = OPP[s.dir];
      if (o.quests) await Quest.talk(o, p); else await UI.talk(o.lines);
      if (o.act === 'inn' && await UI.confirm('すこし やすんでいきますか？')) {
        await UI.fade(1, 400); p.hp = p.maxHp; p.mp = p.maxMp; p.st = {}; await UI.fade(0, 400); await UI.say('HPと MPが ぜんかいふくした！');
      }
    } else if (o.t === 'chest') {
      if (s.flags[o.id]) { await UI.say('たからばこは からっぽだ。'); return; }
      s.flags[o.id] = 1; let txt;
      if (o.gold) { p.gold += o.gold; txt = `${o.gold}ゴールドを てにいれた！`; }
      else { Items.add(p, o.item, o.n || 1); txt = `${Data.items[o.item].name}${o.n > 1 ? ' x' + o.n : ''}を てにいれた！`; }

      s.flags[o.id] = s.steps + 1; Items.add(p, o.item); await UI.say(`${Data.items[o.item].name}を つみとった！`);
    } else if (o.t === 'boss') {

      const r = await Field_fight(o.m);

    }
  }
};

const Title = {
  stars: Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random() * .6, p: Math.random() * 6 })),
  render(q, W, H) {
    const t = Date.now(), gd = q.createLinearGradient(0, 0, 0, H); gd.addColorStop(0, '#05081a'); gd.addColorStop(.7, '#1b2a6b'); gd.addColorStop(1, '#3a3a7a');
    q.fillStyle = gd; q.fillRect(0, 0, W, H);
    this.stars.forEach(s => { q.globalAlpha = .4 + .6 * Math.abs(Math.sin(t / 700 + s.p)); q.fillStyle = '#fff'; q.fillRect(Math.floor(s.x * W), Math.floor(s.y * H), 1, 1); });
    q.globalAlpha = 1; q.fillStyle = '#f4e7a8'; q.beginPath(); q.arc(W * .8, H * .2, 9, 0, 7); q.fill();
    ['#222a5e', '#141a42', '#0a0e2a'].forEach((c, l) => { q.fillStyle = c; q.beginPath(); q.moveTo(0, H); for (let x = 0; x <= W; x += 8) q.lineTo(x, H * (.74 + .07 * l) - Math.abs(Math.sin(x * .05 + l * 2)) * H * .1); q.lineTo(W, H); q.fill(); });
  }
};

const Game = {
  state: null, scene: 'title', busy: 0, failed: false,
  async run(fn) { if (this.busy) return; this.busy = 1; try { await fn(); } catch (e) { showErr(e); } finally { this.busy = 0; } },
  onAction(a) {
    if (UI.active()) { UI.onAction(a); return; }
    if (this.busy || this.scene !== 'field') return;
    if (a === 'ok') Field.interact(); else if (a === 'menu' || a === 'cancel') this.run(() => Menu.open());
  },
  snapshot() { const s = this.state; return JSON.parse(JSON.stringify({ player: s.player, map: s.map, x: s.x, y: s.y, dir: s.dir, flags: s.flags, steps: s.steps, play: Math.floor(s.play) })); },
  applyState(st) {
    const d = JSON.parse(JSON.stringify(st));
    if (!d || !d.player || !d.player.base || !d.player.equip) return false;
    if (!Data.maps[d.map]) { d.map = 'field'; d.x = Data.maps.field.start.x; d.y = Data.maps.field.start.y; }
    const p = d.player; p.inv = p.inv || {}; p.quests = p.quests || {}; p.st = {}; Player.recalc(p);
    d.flags = d.flags || {}; d.steps = d.steps || 0; d.since = 0; d.play = d.play || 0;
    this.state = d; Field.load(d.map, d.x | 0, d.y | 0, d.dir || 'down'); return true;
  },
  async loadSlot(i) {
    const d = Save.read(i); if (!d) { await UI.say('データが ありません。'); return false; }
    await UI.fade(1, 250); const ok = this.applyState(d.state);
    if (!ok) { await UI.fade(0, 250); await UI.say('セーブデータが こわれています。'); return false; }
    $('#title').style.display = 'none'; this.scene = 'field'; await UI.fade(0, 250); return true;
  },
  async newGame() {
    const names = ['アルト', 'レイ', 'ユウ', 'ソラ', 'じぶんで いれる'];
    const k = await UI.choose(names.map(l => ({ label: l })), { title: 'なまえを えらんでください', pos: 'tb' });
    if (k < 0) return false;
    let name = names[k];
    if (k === 4) { name = 'アルト'; try { const n = prompt('ゆうしゃの なまえ（8もじまで）', name); if (n && n.trim()) name = n.trim().slice(0, 8); } catch (e) { } }
    await UI.fade(1, 300); const st = Data.maps.field.start;
    this.state = { player: Player.create(name), map: 'field', x: st.x, y: st.y, dir: 'down', flags: {}, steps: 0, since: 0, play: 0 };
    Field.load('field', st.x, st.y, 'down'); $('#title').style.display = 'none'; this.scene = 'field'; await UI.fade(0, 300);
    await UI.talk([`${name}は めを さました。そこは みしらぬ せかい「エルディア」だった。`, 'まずは ちかくの いえを たずねてみよう。\n（A：はなす・しらべる　B/MENU：メニュー）']);
    return true;
  },
  async gameOver() {
    const p = this.state.player; await UI.say(`${p.name}は たおれてしまった……`);
    p.gold = Math.floor(p.gold / 2); p.hp = Math.ceil(p.maxHp / 2); p.mp = p.maxMp; p.st = {};
    await UI.fade(1, 500); Field.load('field', 9, 9, 'down'); await UI.fade(0, 500);
    await UI.say('きがつくと むらの まえに いた。\nゴールドが はんぶんに なってしまった…');
  },
  async titleLoop() {
    this.scene = 'title'; $('#title').style.display = 'block';
    for (; ;) {
      const i = await UI.choose([{ label: 'はじめから' }, { label: 'つづきから', dis: !Save.any() }, { label: 'せってい' }], { pos: 'tb', noCancel: true });
      if (i === 0 && await this.newGame()) return;
      if (i === 1) { const l = Save.slotItems().map((x, k) => ({ ...x, dis: !Save.read(k) })); const k = await UI.choose(l, { title: 'ロード', pos: 'tb' }); if (k >= 0 && await this.loadSlot(k)) return; }
      if (i === 2) await Menu.settings();
    }
  },
  start() {
    Save.loadSettings(); Input.init(); Gfx.resize();
    addEventListener('resize', Gfx.resize); addEventListener('orientationchange', () => setTimeout(Gfx.resize, 200));
    let last = performance.now();
    const frame = now => {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      try {
        const q = Gfx.g, W = Gfx.cv.width, H = Gfx.cv.height; q.imageSmoothingEnabled = false;
        if (this.scene === 'title') Title.render(q, W, H);
        else if (this.scene === 'battle') Battle.render(q, W, H);
        else if (this.state) { Field.update(dt); Field.render(q, W, H); }
      } catch (e) { if (!this.failed) { this.failed = true; showErr(e); } }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    this.run(() => this.titleLoop());
  }
};

addEventListener('error', e => showErr(e.error || e.message));
addEventListener('unhandledrejection', e => showErr(e.reason));
const boot = () => { try { Game.start(); } catch (e) { showErr(e); } };
if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>

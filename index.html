<script>
'use strict';
const N=11,T=60,S=N*T,DIR={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},BLOCK=new Set('TWRHDO'),SAVE_KEY='elderia_save_v2';
const maps={field:{name:'星見の草原',exit:{area:'village',x:5,y:9,dir:'up'},rows:['TTTTTETTTTT','TGGFGPGGGGT','TGGGGPGGFGT','GGWWGPGGGGG','GWWWGPGGTGG','GGWWGPPPPGG','GGGGGPGGFGG','GFGGGPGGGGT','GGGGGPGGGGT','TGGGGPGGGGT','TTTTTETTTTT']},village:{name:'エルディアの村',exit:{area:'field',x:5,y:9,dir:'up'},rows:['TTTTTETTTTT','TGGGGGGGGGT','TGHGGGGH GGT'.replace(' ',''),'TGGGGGGGGGT','TGGGGGGGGGT','TGGGGGGGGGT','TGHGGGGGGGT','TGGGGGGGGGT','TGGGGGGGGGT','TGGGGGGGGGT','TTTTTETTTTT']}};
const NPCS=[{a:'village',x:6,y:3,name:'村長',kind:'elder',lines:['よく来たな、旅人よ。','ここはエルディア。星の光に守られた小さな村じゃ。','草原の先には、まだ誰も知らぬ景色が広がっておる。']},{a:'village',x:3,y:6,name:'旅の商人',kind:'traveler',lines:['遠くの山に、夜だけ光る花が咲くそうだよ。','急がなくていい。空を見上げるのも旅のうちさ。']},{a:'village',x:8,y:5,name:'ミナ',kind:'girl',lines:['お兄ちゃん、星のかけらを見つけたんだ！','この村から見る夜空が、いちばん好き。']}];
const PALETTE={hero:{coat:'#547fa5',hair:'#503b36',accent:'#e5bf76'},elder:{coat:'#806b88',hair:'#d8d1bd',accent:'#c9ae76'},traveler:{coat:'#9a7655',hair:'#d8cdb8',accent:'#d7aa69'},girl:{coat:'#bb7c81',hair:'#d9ae70',accent:'#e9d8b8'}};
const P={area:'field',x:5,y:9,dir:'up',hp:30,max:30,lv:1,gold:50};const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),$=s=>document.querySelector(s);let moving=null,dialog=null,held=null,running=false,last=0,fade=0,transition=null;
const tile=(x,y,a=P.area)=>(x<0||y<0||x>=N||y>=N)?'T':maps[a].rows[y][x],npcs=()=>NPCS.filter(n=>n.a===P.area),npcAt=(x,y)=>npcs().find(n=>n.x===x&&n.y===y);
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawTile(ch,x,y,now){const X=x*T,Y=y*T,seed=(x*17+y*31)%13;let base=ch==='W'?'#557e87':ch==='P'||ch==='E'?'#b9a17c':ch==='R'?'#a56f69':ch==='H'||ch==='D'?'#b5a286':ch==='O'?'#a5a997':(x+y)%2?'#718966':'#78906b';let grad=ctx.createLinearGradient(X,Y,X+T,Y+T);grad.addColorStop(0,base);grad.addColorStop(1,ch==='G'||ch==='F'?'#5e795f':ch==='W'?'#385f71':'#907f69');ctx.fillStyle=grad;ctx.fillRect(X,Y,T,T);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;ctx.strokeRect(X+.5,Y+.5,T-1,T-1);
if(ch==='G'||ch==='F'){for(let i=0;i<5;i++){let px=X+((x*23+y*19+i*37)%49)+5,py=Y+((y*29+x*11+i*23)%49)+5;ctx.strokeStyle=i%2?'#a5b78475':'#405e4e6b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px,py+4);ctx.quadraticCurveTo(px-2,py,px,py-2);ctx.stroke()}if(ch==='F'){for(let i=0;i<3;i++){let fx=X+13+i*17,fy=Y+25+(i*11+x*3)%23;ctx.fillStyle=['#e9adad','#f4dd9e','#f3eee1'][i];ctx.beginPath();ctx.arc(fx,fy,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d5bc72';ctx.beginPath();ctx.arc(fx,fy,1,0,Math.PI*2);ctx.fill()}}}
if(ch==='P'||ch==='E'){for(let i=0;i<8;i++){let px=X+(i*19+x*7)%56,py=Y+(i*13+y*9)%56;ctx.fillStyle='#6f5c4850';ctx.beginPath();ctx.ellipse(px,py,2.4,1.3,0,0,Math.PI*2);ctx.fill()}if(ch==='E'){ctx.strokeStyle='#f6e8bd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X+30,Y+17);ctx.lineTo(X+30,Y+43);ctx.moveTo(X+18,Y+30);ctx.lineTo(X+42,Y+30);ctx.stroke();ctx.fillStyle='#f6dfa0';ctx.beginPath();ctx.arc(X+30,Y+30,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9dd';ctx.beginPath();ctx.arc(X+30,Y+30,4,0,Math.PI*2);ctx.fill()}}
if(ch==='W'){ctx.fillStyle='#ffffff22';ctx.beginPath();ctx.ellipse(X+20+(now/900+x*11)%25,Y+20,10,2,-.12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(X+38-(now/1200+y*7)%23,Y+43,8,1.5,.1,0,Math.PI*2);ctx.fill()}
if(ch==='T'){ctx.fillStyle='#25382e55';ctx.beginPath();ctx.ellipse(X+30,Y+51,18,5,0,0,7);ctx.fill();ctx.fillStyle='#604b3d';roundRect(X+26,Y+30,9,27,3,'#765941');let g=ctx.createRadialGradient(X+23,Y+17,4,X+29,Y+27,28);g.addColorStop(0,'#8da276');g.addColorStop(1,'#405e4c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(X+29,Y+23,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6d8965';ctx.beginPath();ctx.arc(X+16,Y+30,13,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(X+42,Y+31,13,0,Math.PI*2);ctx.fill()}
if(ch==='R'){ctx.fillStyle='#765d58';for(let i=0;i<5;i++){ctx.fillRect(X,Y+i*12,T,2);ctx.fillRect(X+(i%2)*18,Y+i*12,2,12)}}
if(ch==='H'||ch==='D'){ctx.fillStyle='#79634d';ctx.fillRect(X+5,Y+6,T-10,T-8);ctx.fillStyle=ch==='H'?'#c3a982':'#d6c39f';ctx.fillRect(X+9,Y+10,T-18,T-15);ctx.fillStyle='#765c49';ctx.beginPath();ctx.moveTo(X+5,Y+14);ctx.lineTo(X+30,Y-3);ctx.lineTo(X+55,Y+14);ctx.closePath();ctx.fill();if(ch==='H'){ctx.fillStyle='#46616b';ctx.fillRect(X+16,Y+21,11,13);ctx.fillRect(X+34,Y+21,11,13);ctx.fillStyle='#785b44';ctx.fillRect(X+25,Y+38,10,19);ctx.fillStyle='#d2bd8c';ctx.beginPath();ctx.arc(X+32,Y+48,1.3,0,7);ctx.fill()}}
if(ch==='O'){ctx.fillStyle='#66716d';ctx.beginPath();ctx.ellipse(X+30,Y+35,22,15,0,0,7);ctx.fill();ctx.fillStyle='#5e92a0';ctx.beginPath();ctx.ellipse(X+30,Y+32,15,8,0,0,7);ctx.fill();ctx.fillStyle='#d4e5cf77';ctx.beginPath();ctx.ellipse(X+26,Y+29,6,2,-.3,0,7);ctx.fill()}}
function drawPerson(x,y,dir,p,now,isHero=false){const X=x*T,Y=y*T+Math.sin(now/260+(x+y))*1.1;ctx.fillStyle='#15202a55';ctx.beginPath();ctx.ellipse(X+30,Y+53,15,5,0,0,7);ctx.fill();let robe=ctx.createLinearGradient(X+14,Y+25,X+46,Y+47);robe.addColorStop(0,p.coat);robe.addColorStop(1,'#34445a');ctx.fillStyle=robe;ctx.beginPath();ctx.moveTo(X+19,Y+25);ctx.quadraticCurveTo(X+30,Y+20,X+41,Y+25);ctx.lineTo(X+46,Y+48);ctx.quadraticCurveTo(X+30,Y+54,X+14,Y+48);ctx.closePath();ctx.fill();ctx.fillStyle='#eee0c7';ctx.fillRect(X+24,Y+27,12,3);ctx.fillStyle=p.accent;ctx.fillRect(X+28,Y+29,4,15);ctx.fillStyle='#40352f';roundRect(X+19,Y+46,9,8,3,'#463a35');roundRect(X+32,Y+46,9,8,3,'#463a35');ctx.fillStyle='#e6c6a0';ctx.beginPath();ctx.ellipse(X+30,Y+19,10,12,0,0,7);ctx.fill();ctx.fillStyle=p.hair;ctx.beginPath();ctx.moveTo(X+20,Y+17);ctx.quadraticCurveTo(X+20,Y+5,X+31,Y+7);ctx.quadraticCurveTo(X+42,Y+7,X+40,Y+18);ctx.lineTo(X+36,Y+15);ctx.quadraticCurveTo(X+29,Y+19,X+21,Y+15);ctx.closePath();ctx.fill();if(dir!=='up'){ctx.fillStyle='#49392f';ctx.beginPath();ctx.arc(X+27,Y+20,1,0,7);ctx.arc(X+34,Y+20,1,0,7);ctx.fill();ctx.strokeStyle='#956f60';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(X+28,Y+25);ctx.quadraticCurveTo(X+31,Y+27,X+34,Y+25);ctx.stroke()}if(isHero){ctx.strokeStyle='#f2d89a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X+30,Y+31,18,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}}
function render(now=0){ctx.clearRect(0,0,S,S);for(let y=0;y<N;y++)for(let x=0;x<N;x++)drawTile(tile(x,y),x,y,now);for(const n of npcs())drawPerson(n.x,n.y,n.dir,PALETTE[n.kind],now);let x=P.x,y=P.y;if(moving){const q=Math.min(1,(now-moving.t0)/165);x=moving.x+(moving.tx-moving.x)*q;y=moving.y+(moving.ty-moving.y)*q}drawPerson(x,y,P.dir,PALETTE.hero,now,true);if(transition){ctx.fillStyle=`rgba(8,13,24,${fade})`;ctx.fillRect(0,0,S,S)}}
function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(cv.width/S,0,0,cv.height/S,0,0);render(performance.now())}new ResizeObserver(resize).observe(cv);
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(P))}catch(e){}}function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s||!maps[s.area]||!Number.isInteger(s.x)||!Number.isInteger(s.y)||s.x<0||s.x>=N||s.y<0||s.y>=N)return null;return {...P,...s}}catch(e){return null}}
function updateHud(){$('#level').textContent='Lv. '+P.lv;$('#hpText').textContent=`${P.hp} / ${P.max}`;$('#hpFill').style.width=`${Math.max(0,Math.min(100,P.hp/P.max*100))}%`;$('#gold').textContent='◈ '+P.gold;$('#areaName').textContent=maps[P.area].name}
function showDialog(name,lines){dialog={name,lines,index:0};$('#messageName').textContent=name;$('#messageText').textContent=lines[0];$('#message').classList.add('show')}
function nextDialog(){if(!dialog)return;dialog.index++;if(dialog.index>=dialog.lines.length){dialog=null;$('#message').classList.remove('show');return}$('#messageText').textContent=dialog.lines[dialog.index]}
function move(d,now=performance.now()){if(dialog||moving||transition||$('#modal').classList.contains('open'))return;P.dir=d;const [dx,dy]=DIR[d],x=P.x+dx,y=P.y+dy;if(BLOCK.has(tile(x,y))||npcAt(x,y))return;moving={x:P.x,y:P.y,tx:x,ty:y,t0:now}}
function act(){if(dialog){nextDialog();return}if(moving||transition)return;const [dx,dy]=DIR[P.dir],n=npcAt(P.x+dx,P.y+dy)||npcs().find(o=>Math.abs(o.x-P.x)+Math.abs(o.y-P.y)===1);if(n){showDialog(n.name,n.lines);return}if(tile(P.x,P.y)==='O'){showDialog('星の泉',['水面に星明かりが揺れている。','旅の疲れが少しだけ癒えた。']);P.hp=P.max;updateHud();save();return}if(tile(P.x,P.y)==='H'){showDialog('小さな家',['窓からあたたかな灯りがこぼれている。']);return}showDialog('旅の記録',['風が草原を渡っていく。','まだ見ぬ景色を探しに行こう。'])}
function changeArea(target){transition=target;fade=0}
function tick(now){if(!running)return;const dt=Math.min(50,now-(last||now));last=now;if(moving&&now-moving.t0>=165){P.x=moving.tx;P.y=moving.ty;moving=null;if(tile(P.x,P.y)==='E')changeArea(maps[P.area].exit);save()}if(transition){fade=Math.min(1,fade+dt/260);if(fade>=1){P.area=transition.area;P.x=transition.x;P.y=transition.y;P.dir=transition.dir;transition=null;fade=0;updateHud();save()}}else if(held&&now-held.since>220&&now-held.last>145){held.last=now;move(held.dir,now)}render(now);requestAnimationFrame(tick)}
function start(){const s=load();Object.assign(P,s||{area:'field',x:5,y:9,dir:'up',hp:30,max:30,lv:1,gold:50});if(!s)save();$('#title').classList.add('hidden');$('#game').classList.remove('hidden');requestAnimationFrame(()=>{$('#game').classList.add('active');resize()});updateHud();running=true;last=0;requestAnimationFrame(tick)}
function toTitle(){save();running=false;$('#modal').classList.remove('open');$('#game').classList.remove('active');setTimeout(()=>{if(!running)$('#game').classList.add('hidden');$('#title').classList.remove('hidden');$('#continueBtn').disabled=!load()},300)}
function openMenu(){const hp=`${P.hp} / ${P.max}`;$('#modalBody').innerHTML=`<p><b>${maps[P.area].name}</b><br>冒険者　Lv. ${P.lv}<br>HP　${hp}<br>所持金　${P.gold} G</p><p>この世界の景色を眺めながら、ゆっくり旅を続けよう。</p>`;$('#modal').classList.add('open')}
$('#startBtn').addEventListener('click',()=>{Object.assign(P,{area:'field',x:5,y:9,dir:'up',hp:30,max:30,lv:1,gold:50});save();start()});$('#continueBtn').addEventListener('click',start);$('#menuBtn').addEventListener('click',openMenu);$('#actBtn').addEventListener('click',act);$('#closeBtn').addEventListener('click',()=>$('#modal').classList.remove('open'));$('#titleBtn').addEventListener('click',toTitle);$('#statusBtn').addEventListener('click',openMenu);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')});$('#message').addEventListener('click',nextDialog);
document.querySelectorAll('.dpad button').forEach(b=>{const d=b.dataset.d;const down=e=>{e.preventDefault();held={dir:d,since:performance.now(),last:0};b.classList.add('on');move(d)};const up=()=>{if(held?.dir===d)held=null;b.classList.remove('on')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};window.addEventListener('keydown',e=>{if(keyMap[e.key]){e.preventDefault();if(!keys.has(e.key)){keys.add(e.key);move(keyMap[e.key])}}else if(e.key===' '||e.key==='Enter'){e.preventDefault();act()}else if(e.key==='Escape')$('#modal').classList.toggle('open')});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>{held=null;keys.clear()});$('#continueBtn').disabled=!load();
</script></body></html>

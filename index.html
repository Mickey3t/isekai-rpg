<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101a46">
<title>異世界エルディア</title>
<style>
:root{--gold:#f3d37b;--blue:#101b52;--blue2:#263f87;--edge:#dce7ff;--ink:#07102f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d22;color:#fff;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
body{background:radial-gradient(ellipse at 50% 20%,#283e78 0,#121d49 45%,#080d22 100%)}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;width:min(100%,520px);height:100dvh;margin:auto;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:linear-gradient(180deg,rgba(20,35,83,.38),rgba(4,8,24,.35))}
/* レトロRPG風タイトル */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 18px;background:linear-gradient(180deg,#0b1643 0%,#263d78 48%,#805477 78%,#d18a67 100%)}
#title:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:39px 37px;opacity:.55;mask-image:linear-gradient(#000 0%,transparent 67%)}
.moon{position:absolute;width:58px;height:58px;border-radius:50%;right:14%;top:10%;background:#fff0bf;box-shadow:0 0 32px 12px #ffe8a755}
.castle{position:absolute;width:100%;height:28%;bottom:0;left:0;opacity:.9}
.title-card{z-index:1;text-align:center;margin-top:auto;margin-bottom:12px;text-shadow:2px 3px #101537,0 0 14px #f4cf77}
.title-card small{display:block;color:#dce6ff;letter-spacing:.28em;font-size:11px}
.title-card h1{margin:8px 0;font-size:clamp(30px,8vw,46px);letter-spacing:.08em;color:#ffe9a4;-webkit-text-stroke:1px #70491e;text-shadow:2px 3px #171b48,0 0 18px #f6cc67}
.title-card p{margin:0;color:#fff1cf;font-size:13px;letter-spacing:.16em}
.retro-btn,.menu-btn{border:3px ridge #e4d59e;background:linear-gradient(#344e96,#17265b);box-shadow:inset 0 0 0 2px #526bac,0 4px #070d27,0 8px 16px #0007;border-radius:3px;font-weight:700;letter-spacing:.12em}
.retro-btn{z-index:1;width:min(290px,90%);padding:13px 10px;margin:3px 0;font-size:16px}
.retro-btn.primary{background:linear-gradient(#d5a846,#875b20);box-shadow:inset 0 0 0 2px #f4d781,0 4px #3f2915,0 8px 16px #0007;color:#fff5d5}
.retro-btn:active,.menu-btn:active{transform:translateY(2px);filter:brightness(1.2)}
.retro-btn:disabled{opacity:.42}
.copyright{z-index:1;font-size:10px;color:#e5d7e8;margin:4px 0 8px}
/* ゲーム画面 */
#game{position:absolute;inset:0;display:none;flex-direction:column;gap:7px;padding:env(safe-area-inset-top) 10px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(#111c48,#080d21)}
.hud{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;padding:8px 10px;border:3px ridge var(--edge);background:linear-gradient(120deg,#1d3477,#101a4a 55%,#26376d);box-shadow:inset 0 0 0 2px #5269ae,0 3px #05091a;border-radius:3px;font-size:12px;flex-shrink:0}
.hud-label{color:#d8e3ff;font-size:10px}.hud b{color:#fff0a8;font-size:14px}.hpbox{min-width:0}.hp-line{display:flex;justify-content:space-between;align-items:center}.bar{height:8px;margin-top:3px;background:#101329;border:1px solid #8593bd}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#79e78f,#d7e66b)}
.menu-btn{padding:6px 8px;font-size:11px;letter-spacing:.04em;white-space:nowrap}
#scene-wrap{position:relative;flex:0 1 auto;width:min(100%,calc(100dvh - 270px));max-height:calc(100dvh - 255px);aspect-ratio:1;margin:0 auto;border:4px ridge #e4d49a;background:#13204b;box-shadow:0 0 0 2px #090d20,0 8px 22px #0009;overflow:hidden}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#area-name{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:5px 13px;background:#0d1746eF;border:2px ridge #d9d4b8;font-size:13px;letter-spacing:.1em;white-space:nowrap;text-shadow:1px 2px #000}
#message{position:absolute;left:7px;right:7px;bottom:7px;min-height:84px;padding:10px 13px 22px;border:4px ridge #e2e8fa;background:linear-gradient(135deg,#1c3477F5,#0b1648F7);box-shadow:inset 0 0 0 2px #516bb4,0 4px 12px #0009;display:none;font-size:15px;line-height:1.55;text-shadow:1px 1px #10152d}
#message-name{color:#ffe28c;font-size:12px;font-weight:bold;margin-bottom:3px}#message-next{position:absolute;right:12px;bottom:3px;color:#fff2b0;animation:blink .8s steps(2) infinite}@keyframes blink{50%{opacity:0}}
#pad{flex:1;min-height:120px;display:flex;align-items:center;justify-content:space-around;gap:12px;padding:0 5px}
#dpad{display:grid;grid-template-columns:repeat(3,clamp(43px,13vw,56px));grid-template-rows:repeat(3,clamp(43px,13vw,56px));gap:3px}
.d{border:2px ridge #d1dcfa;border-radius:3px;background:linear-gradient(#344e91,#172654);box-shadow:inset 0 0 0 2px #536ca8,0 3px #060b20;font-size:20px;touch-action:none}.d.on,.d:active{background:#6686ce;transform:translateY(2px)}
#aBtn{width:clamp(72px,22vw,90px);height:clamp(72px,22vw,90px);border:4px ridge #ffe39a;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffedab,#a66e24);color:#fff8d8;text-shadow:1px 2px #60370c;font-weight:bold;box-shadow:0 4px #39250d,0 8px 12px #0008;touch-action:none}
/* メニューウィンドウ */
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#03071699;z-index:5}
.window{width:min(360px,94%);padding:15px;border:4px ridge #e2e8fa;background:linear-gradient(145deg,#243d83,#0b1648);box-shadow:inset 0 0 0 2px #5971b2,0 8px 25px #000b}
.window h2{margin:0 0 12px;padding-bottom:8px;color:#ffe39a;border-bottom:1px solid #8698d0;font-size:16px;letter-spacing:.12em}
.window p{margin:8px 0;font-size:14px;line-height:1.6}.window-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.window-actions button{padding:9px 5px;border:2px ridge #c9d6f5;background:#172858;font-size:13px}
@media(max-height:650px){#game{gap:4px}.hud{padding:5px 8px}#scene-wrap{width:min(100%,calc(100dvh - 225px));max-height:calc(100dvh - 220px)}#pad{min-height:105px}#dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}}
</style>
</head>
<body><div id="app">
<div id="title"><div class="moon"></div><svg class="castle" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g fill="#101532"><path d="M0 150V125q55-22 115-4t100-20q65-22 115 4t70-10v55z"/><rect x="55" y="71" width="48" height="79"/><path d="M48 73l31-55 31 55z"/><rect x="165" y="48" width="69" height="102"/><path d="M154 50l45-47 46 47z"/><rect x="287" y="82" width="48" height="68"/><path d="M280 84l31-49 31 49z"/><rect x="100" y="105" width="65" height="45"/><rect x="234" y="104" width="53" height="46"/></g><g fill="#ffe18a"><rect x="73" y="94" width="8" height="13"/><rect x="195" y="66" width="10" height="15"/><rect x="306" y="103" width="8" height="13"/></g></svg>
<div class="title-card"><small>RETRO FANTASY ROLE PLAYING GAME</small><h1>異世界エルディア</h1><p>～運命を切り開く冒険者～</p></div><button class="retro-btn primary" onclick="startGame()">▶　冒険をはじめる</button><button class="retro-btn" id="contBtn" onclick="continueGame()">冒険をつづける</button><div class="copyright">© Elderia Project</div></div>
<div id="game"><header class="hud"><div><div class="hud-label">冒険者</div><b id="hLv">Lv.1</b></div><div class="hpbox"><div class="hp-line"><span>HP</span><b id="hHp">30 / 30</b></div><div class="bar"><i id="hBar"></i></div></div><div><div class="hud-label">所持金</div><b><span id="hG">50</span> G</b></div><button class="menu-btn" onclick="openMenu()">メニュー</button></header>
<div id="scene-wrap"><canvas id="cv" width="528" height="528"></canvas><div id="area-name"></div><div id="message"><div id="message-name"></div><div id="message-text"></div><div id="message-next">▼</div></div></div>
<div id="pad"><div id="dpad"><span></span><button class="d" data-d="up">▲</button><span></span><button class="d" data-d="left">◀</button><span></span><button class="d" data-d="right">▶</button><span></span><button class="d" data-d="down">▼</button><span></span></div><button id="aBtn">けってい</button></div>
</div>
<div id="modal" onclick="if(event.target===this)closeMenu()"><div class="window"><h2 id="modal-title">冒険の書</h2><div id="modal-body"></div><div class="window-actions"><button onclick="showStatus()">つよさ</button><button onclick="saveAndClose()">セーブ</button><button onclick="showItems()">どうぐ</button><button onclick="closeMenu()">とじる</button></div></div></div>
</div>
<script>
"use strict";
const N=11,T=48,S=N*T,D={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},BLOCK=new Set("TWRHDO");
const maps={field:{name:"始まりの草原",exit:{area:"village",x:5,y:9,dir:"up"},rows:["TTTTTETTTTT","TGGFGPGGGGT","TGGGGPGGFGT","GGWWGPGGGGG","GWWWGPGGTGG","GGWWGPPPPGG","GGGGGPGGFGG","GFGGGPGGGGT","GGGGGPGTGGT","TGGFGPGGGGT","TTGGGPGGGTT"]},village:{name:"エルディアの村",exit:{area:"field",x:5,y:1,dir:"down"},rows:["TTTTTTTTTTT","TRRGGGGRRGT","THDGGGGHDGT","GGGGGPGGGGG","GFGPPPPPGFG","GGGGGPGGOGG","GGGGGPGGGGG","GFGGGPGGGFG","GGGGGPGGGGG","TGGGGPGGGGT","TTTTTETTTTT"]}};
const colors={hero:{body:"#3b6fd1",hair:"#56371e"},elder:{body:"#87539c",hair:"#eee"},villager:{body:"#99a64c",hair:"#70401f"},traveler:{body:"#9b7447",hair:"#ddd"},girl:{body:"#df78a0",hair:"#e5b54e"}};
const NPCS=[{a:"village",x:6,y:3,name:"村長",kind:"elder",lines:["よく来たな、冒険者よ。","ここは辺境の村エルディア。","北の草原には魔物が潜んでおる。","まずは村の外を歩いてみるとよい。"]},{a:"village",x:7,y:6,name:"村人",kind:"villager",lines:["ようこそ、エルディアの村へ！","この井戸の水は、傷を癒やすと言われておる。"]},{a:"village",x:3,y:7,name:"旅人",kind:"traveler",lines:["この世界には強力な魔物がいるらしい。","南の草原を越えた先には、古い遺跡があるとか…。"]},{a:"village",x:4,y:4,name:"少女",kind:"girl",lines:["ねえねえ、冒険者さん！","あの家のドアは、まだ鍵がかかっているの。","そのうち開くかも？"]}];
const P={area:"field",x:5,y:9,dir:"up",hp:30,max:30,lv:1,gold:50};const KEY="elderia_save_v1";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),$=id=>document.getElementById(id);let mv=null,dialog=null,held=null,running=false,last=0,fade=0,fadeTo=null;const keys=new Set();
const tile=(x,y,a=P.area)=>(x<0||y<0||x>=N||y>=N)?"T":maps[a].rows[y][x],npcs=()=>NPCS.filter(n=>n.a===P.area),npcAt=(x,y)=>npcs().find(n=>n.x===x&&n.y===y);
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function drawTile(ch,x,y,t){let X=x*T,Y=y*T;
 if("GFO".includes(ch)){rect(X,Y,T,T,(x+y)%2?"#68a746":"#619b40");for(let i=0;i<4;i++){let gx=X+((x*13+y*7+i*19)%43),gy=Y+((y*17+x*5+i*11)%42);rect(gx,gy,2,5,"#8bc65d")}}
 if(ch==="F"){for(let i=0;i<3;i++){let fx=X+10+i*13,fy=Y+18+(i*7+x*3)%17;rect(fx,fy,3,3,["#ff92b4","#fff0a2","#fff"][i])}}
 if(ch==="P"||ch==="E"){rect(X,Y,T,T,"#c9aa72");for(let i=0;i<5;i++)rect(X+(i*13+x*7)%45,Y+(i*17+y*3)%45,3,2,"#ab8c58");if(ch==="E"){rect(X+15,Y+18,18,4,"#fff4c2");rect(X+22,Y+12,4,17,"#fff4c2");rect(X+19,Y+15,10,10,"#f6d675")}}
 if(ch==="T"){rect(X+20,Y+29,8,15,"#6c472b");ctx.fillStyle="#23633b";ctx.beginPath();ctx.arc(X+24,Y+21,19,0,Math.PI*2);ctx.fill();ctx.fillStyle="#32834a";ctx.beginPath();ctx.arc(X+17,Y+24,12,0,Math.PI*2);ctx.arc(X+31,Y+24,12,0,Math.PI*2);ctx.fill()}
 if(ch==="W"){rect(X,Y,T,T,"#327fb9");for(let i=0;i<3;i++)rect(X+5+(i*13)%31,Y+8+i*14,31,2,"#a6dcf4")}
 if(ch==="R"){rect(X,Y,T,T,"#b94d40");for(let i=0;i<4;i++)rect(X,Y+i*12,T,2,"#82362f");for(let i=0;i<4;i++)rect(X+(i%2)*8+i*12,Y+i*12,2,9,"#86382f")}
 if(ch==="H"||ch==="D"){rect(X,Y,T,T,"#eadbb9");rect(X,Y,T,4,"#8d6842");rect(X,Y,4,T,"#8d6842");rect(X+T-4,Y,4,T,"#8d6842");if(ch==="H"){rect(X+11,Y+10,26,22,"#643f27");rect(X+14,Y+13,9,16,"#79b9dc");rect(X+25,Y+13,9,16,"#79b9dc")}else{rect(X+13,Y+17,22,27,"#684322");rect(X+22,Y+27,3,3,"#f3d37b")}}
 if(ch==="O"){ctx.fillStyle="#aeb5c0";ctx.beginPath();ctx.ellipse(X+24,Y+27,18,12,0,0,6.3);ctx.fill();ctx.fillStyle="#3b91ca";ctx.beginPath();ctx.ellipse(X+24,Y+26,12,6,0,0,6.3);ctx.fill()}
}
function person(x,y,dir,p){let X=x*T,Y=y*T;rect(X+16,Y+36,16,6,"#1b2134");rect(X+16,Y+23,16,15,p.body);rect(X+18,Y+10,12,13,"#f3cc9d");rect(X+17,Y+8,14,6,p.hair);if(dir!=="up"){rect(X+19,Y+16,2,2,"#171717");rect(X+26,Y+16,2,2,"#171717")}rect(X+18,Y+39,5,6,"#2d3450");rect(X+26,Y+39,5,6,"#2d3450")}
function render(now){ctx.clearRect(0,0,S,S);for(let y=0;y<N;y++)for(let x=0;x<N;x++)drawTile(tile(x,y),x,y,now);let entities=npcs().map(n=>({y:n.y,fn:()=>person(n.x,n.y,n.dir,colors[n.kind])}));let px=mv?mv.x+(mv.tx-mv.x)*Math.min(1,(now-mv.t0)/150):P.x,py=mv?mv.y+(mv.ty-mv.y)*Math.min(1,(now-mv.t0)/150):P.y;entities.push({y:py,fn:()=>person(px,py,P.dir,{body:"#3b6fd1",hair:"#56371e"})});entities.sort((a,b)=>a.y-b.y).forEach(e=>e.fn());if(fade>0){rect(0,0,S,S,`rgba(0,0,0,${fade})`)}}
function frame(now){if(!running)return;let dt=Math.min(50,now-(last||now));last=now;update(now,dt);render(now);requestAnimationFrame(frame)}
function update(now,dt){if(mv&&now-mv.t0>=150){P.x=mv.tx;P.y=mv.ty;mv=null;arrive()}if(fadeTo){fade=Math.min(1,fade+dt/230);if(fade>=1){P.area=fadeTo.area;P.x=fadeTo.x;P.y=fadeTo.y;P.dir=fadeTo.dir;fadeTo=null;$("area-name").textContent=maps[P.area].name;save()}}else if(fade>0)fade=Math.max(0,fade-dt/230);if(dialog&&dialog.n<dialog.lines[dialog.i].length){dialog.acc+=dt;while(dialog.acc>28&&dialog.n<dialog.lines[dialog.i].length){dialog.acc-=28;dialog.n++}$("message-text").textContent=dialog.lines[dialog.i].slice(0,dialog.n);$("message-next").style.visibility=dialog.n>=dialog.lines[dialog.i].length?"visible":"hidden"}let d=held||[...keys].pop();if(d&&!mv&&!dialog&&!fadeTo)tryMove(d,now)}
function tryMove(d,now){P.dir=d;let [dx,dy]=D[d],x=P.x+dx,y=P.y+dy;if(BLOCK.has(tile(x,y))||npcAt(x,y))return;mv={x:P.x,y:P.y,tx:x,ty:y,t0:now}}
function arrive(){if(tile(P.x,P.y)==="E")fadeTo=maps[P.area].exit;save()}
function say(name,lines){dialog={name,lines,i:0,n:0,acc:0};$("message-name").textContent=name;$("message-text").textContent="";$("message-next").style.visibility="hidden";$("message").style.display="block"}
function advance(){if(!dialog)return;if(dialog.n<dialog.lines[dialog.i].length){dialog.n=dialog.lines[dialog.i].length;$("message-text").textContent=dialog.lines[dialog.i];$("message-next").style.visibility="visible";return}dialog.i++;if(dialog.i>=dialog.lines.length){dialog=null;$("message").style.display="none";save()}else{dialog.n=0;dialog.acc=0}}
function act(){if(dialog){advance();return}if(mv||fadeTo)return;let [dx,dy]=D[P.dir],x=P.x+dx,y=P.y+dy,n=npcAt(x,y)||npcs().find(o=>Math.abs(o.x-P.x)+Math.abs(o.y-P.y)===1);if(n){say(n.name,n.lines);return}if(tile(x,y)==="D"){say("",["扉には鍵がかかっている。"]);return}if(tile(x,y)==="O"){P.hp=P.max;hud();say("",["井戸の水でHPが全回復した！"]);return}say("",["……しかし、何も見つからなかった。"])}
function hud(){$("hLv").textContent="Lv."+P.lv;$("hHp").textContent=P.hp+" / "+P.max;$("hBar").style.width=(P.hp/P.max*100)+"%";$("hG").textContent=P.gold}
function enter(){$("title").style.display="none";$("game").style.display="flex";$("area-name").textContent=maps[P.area].name;mv=null;dialog=null;$("message").style.display="none";hud();if(!running){running=true;last=0;requestAnimationFrame(frame)}}
function startGame(){Object.assign(P,{area:"field",x:5,y:9,dir:"up",hp:30,max:30,lv:1,gold:50});save();enter()}
function continueGame(){let s=load();if(s){Object.assign(P,s);enter()}}
function backToTitle(){save();running=false;$("game").style.display="none";$("title").style.display="flex";$("contBtn").disabled=!load()}
function save(){try{localStorage.setItem(KEY,JSON.stringify({area:P.area,x:P.x,y:P.y,dir:P.dir,hp:P.hp,max:P.max,lv:P.lv,gold:P.gold}))}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));return s&&maps[s.area]?s:null}catch(e){return null}}
function openMenu(){$("modal").style.display="flex";showStatus()}function closeMenu(){$("modal").style.display="none"}function showStatus(){$("modal-title").textContent="つよさ";$("modal-body").innerHTML=`<p>冒険者　　Lv.${P.lv}</p><p>HP　　　 ${P.hp} / ${P.max}</p><p>所持金　　${P.gold} G</p><p>現在地　　${maps[P.area].name}</p>`}function showItems(){$("modal-title").textContent="どうぐ";$("modal-body").innerHTML="<p>どうぐ袋は空っぽだ。</p>"}function saveAndClose(){save();$("modal-title").textContent="冒険の書";$("modal-body").innerHTML="<p>冒険の記録をセーブした！</p>";setTimeout(closeMenu,700)}
document.querySelectorAll(".d").forEach(b=>{let d=b.dataset.d;const on=e=>{e.preventDefault();held=d;b.classList.add("on")},off=()=>{if(held===d)held=null;b.classList.remove("on")};b.addEventListener("pointerdown",on);["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,off))});$("aBtn").addEventListener("pointerdown",e=>{e.preventDefault();act()});$("message").addEventListener("pointerdown",e=>{e.preventDefault();advance()});document.addEventListener("keydown",e=>{let d={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"}[e.key];if(d){keys.delete(d);keys.add(d);e.preventDefault()}else if(e.key===" "||e.key==="Enter"||e.key==="z"){e.preventDefault();if($("modal").style.display==="flex")closeMenu();else act()}});document.addEventListener("keyup",e=>{let d={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"}[e.key];if(d)keys.delete(d)});document.addEventListener("contextmenu",e=>e.preventDefault());$("contBtn").disabled=!load();
</script></body></html>
